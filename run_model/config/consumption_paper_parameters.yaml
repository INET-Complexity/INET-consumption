account_diagnostics:
  # Consumed by run_model/src/household_account_diagnostics.py:
  #   account_rules                               → compute_household_accounts_from_rules (HFCS-to-paper-concept mapping)
  #   real_value_deflators                        → read_runtime_household_panel (CPI series selection)
  #   runtime_income.label                        → read_runtime_household_panel (income column rename)
  #   runtime_diagnostics.household_account_fields → read_runtime_household_panel (HDF5 field list)
  account_rules:
    lfa:
      components:
        - ["Wealth in Deposits", "DA2101"]
    ifa:
      components:
        - aliases: ["Mutual Funds", "DA2102"]
          apply_population_scale: true
        - aliases: ["Bonds", "DA2103"]
          apply_population_scale: true
        - aliases: ["Shares", "DA2105"]
          apply_population_scale: true
        - aliases: ["Managed Accounts", "DA2106"]
          apply_population_scale: true
        - aliases: ["Money owed to Households", "DA2107"]
          apply_population_scale: true
        - aliases: ["Other Assets", "DA2108"]
          apply_population_scale: true
        - aliases: ["Voluntary Pension", "DA2109"]
          apply_population_scale: true
    ha:
      components:
        - ["Value of the Main Residence", "DA1110"]
        - aliases: ["Value of Other Non-Business Real Estate", "Value of other Non-Business Real Estate", "DA1122"]
          apply_population_scale: true
    mr:
      preferred: ["Outstanding Balance of Mortgage Debt", "DL1100"]
      apply_population_scale: true
      fallback_components:
        - aliases: ["Outstanding Balance of HMR Mortgages", "DL1110"]
          apply_population_scale: true
        - aliases: ["Outstanding Balance of Mortgages on other Properties", "DL1120"]
          apply_population_scale: true
    db:
      preferred: ["Outstanding Balance of Non-Mortgage Debt", "DL1200"]
      apply_population_scale: true
      fallback_components:
        - aliases: ["Outstanding Balance of Credit Line", "DL1210"]
          apply_population_scale: true
        - aliases: ["Outstanding Balance of Credit Card Debt", "DL1220"]
          apply_population_scale: true
        - aliases: ["Outstanding Balance of other Non-Mortgage Loans", "DL1230"]
          apply_population_scale: true
    nw:
      formula: LFA + IFA + HA - MR - DB
  runtime_income:
    field: income
    label: model_spendable_income
  real_value_deflators:
    default: cpi_fixed_basket
    sensitivity: cpi_transaction
  runtime_diagnostics:
    household_account_fields:
      - income
      - consumption
      - liquid_financial_assets
      - illiquid_financial_assets
      - wealth_main_residence
      - wealth_other_properties
      - wealth_other_real_assets  # optional — stripped from the required set by diagnostics code; retained here so the optional HDF5 read is attempted
      - mortgage_debt
      - consumption_loan_debt
      - debt
      - net_wealth

asset_returns:
  paper_stochastic_v1:
    other_real_assets_depreciation_rate: 0.05
    mu_eq: 0.0029
    mu_bond: 0.0081
    sigma_eq: 0.0935
    sigma_bond: 0.0316
    rho: -0.2585
    equity_weight: 0.5
    draw_scope: country_period
    dividend_fund_payout_ratio: 0.10
    dividend_fund_firm_payout_ratio: 0.10
    dividend_fund_bank_payout_ratio: 0.10

desired_consumption:
  credit_augmented_v1:
    # Paper symbols (Chauvin-Muellbauer notation):
    #   alpha_0=long_run_intercept, alpha_1=real_borrowing_rate_propensity,
    #   alpha_2=permanent_income_propensity,
    #   gamma_1=liquid_wealth_propensity, gamma_2=illiquid_wealth_propensity,
    #   gamma_3=housing_wealth_propensity, gamma_4=house_price_propensity,
    #   beta_1=income_growth_propensity, beta_2=interest_rate_cashflow_propensity,
    #   beta_3=uncertainty_propensity, lambda=partial_adjustment_speed
    # Source: Chauvin & Muellbauer (2018), Table 1; beta_2 and beta_3 to be calibrated.
    long_run_intercept: 0.08
    real_borrowing_rate_propensity: -0.72
    permanent_income_propensity: 0.55
    liquid_wealth_propensity: 0.14
    illiquid_wealth_propensity: 0.022
    housing_wealth_propensity: 0.013
    rent_propensity: 1.0
    mortgage_debt_propensity: 0.03
    mortgage_payment_propensity: 1.0
    house_price_propensity: -0.062
    income_growth_propensity: 0.15
    interest_rate_cashflow_propensity: -0.003
    uncertainty_propensity: -0.005
    partial_adjustment_speed: 0.56
    long_run_mpc_lower_bound: 0.0
    long_run_mpc_upper_bound: 2.0
    price_floor: 1.0e-12
    income_floor: 1.0e-12
    consumption_floor: 1.0e-12
    house_price_floor: 1.0e-12
    uses_income_belief_learning: true
    income_belief_learning_horizon:
      paper_parameter_file: consumption_paper_parameters.yaml
      paper_parameter_ref: income_belief_learning.permanent_income_log_ratio

  credit_augmented_v2:
    # ------------------------------------------------------------------
    # Continuous calibration v2 -- HFCS France, estimated 2026-08-15.
    #
    # Supersedes the PR #88 constants in credit_augmented_v1's
    # continuous_wealth_calibration block, which were NOT fitted to micro-data:
    # they were fitted to reproduce the discrete 8-cell lookup table, which was
    # itself calibrated to Chauvin-Muellbauer Table 3. v2 is estimated directly
    # on the HFCS cross-section by minimum distance on six survey-weighted
    # moments of log(C/Y) -- mean, median, s.d., skewness, and the correlations
    # with log(Y^p/Y) and NLA/Y.
    #
    # Provenance: consumption-notebooks/consumption_parameters_calibration.ipynb
    #   estimation wave  2014 only (n = 7,393); 2017/2021 held out
    #   pooled sample    22,371 households of 35,973 raw
    #   optimiser        seeded 50-start L-BFGS-B, seed 20260815
    #   objective        1.869430e-02
    # ------------------------------------------------------------------
    long_run_intercept: -0.4638           # alpha_0, ESTIMATED.
    # v1 used 0.08 plus a -0.5209 hand recentring applied downstream to force
    # median C*/y onto the HFCS anchor. v2 estimates the intercept on the data,
    # so that recentring must NOT be reapplied on top of this value.
    real_borrowing_rate_propensity: -0.72  # alpha_1, unchanged (paper Table 1)
    # INERT while uses_continuous_wealth_calibration is true: alpha_2 and gamma_1 then
    # come from the fitted mapping, household by household, and these scalars are not
    # read. Carried at their v1 values so that turning the flag off degrades to v1
    # behaviour rather than to the class defaults (1.0 / 0.04), which no calibration
    # stands behind.
    permanent_income_propensity: 0.55      # alpha_2 fallback
    liquid_wealth_propensity: 0.14         # gamma_1 fallback
    illiquid_wealth_propensity: 0.02       # gamma_2, FIXED in the calibration
    housing_wealth_propensity: 0.009       # gamma_4, FIXED in the calibration
    # gamma_2/gamma_4 are held fixed at these values by the estimator rather
    # than estimated, so they are calibration inputs, not results. They differ
    # from v1's 0.022/0.013, which came from the discrete-table fit.
    rent_propensity: 1.0
    mortgage_debt_propensity: 0.03
    mortgage_payment_propensity: 1.0
    house_price_propensity: 0.0
    # gamma_3 stays disabled: the base-1.0-vs-base-100 HPI units problem
    # (issue #90) is unchanged by this recalibration.
    income_growth_propensity: 0.15
    interest_rate_cashflow_propensity: -0.003
    uncertainty_propensity: -0.005
    partial_adjustment_speed: 0.56
    # Two-sided wealth-drag clip. Retained as a backstop only; the continuous
    # mapping should keep most households inside it.
    long_run_mpc_lower_bound: 0.0
    long_run_mpc_upper_bound: 2.0
    # Idiosyncratic term. ESTIMATED JOINTLY with the mapping, not calibrated
    # afterwards: it is the only parameter that raises the dispersion of
    # log(C/Y) without touching its mean or any covariance. Adding it cut the
    # objective 16x (0.303 -> 0.0187) and fixed both the dispersion and the
    # permanent-income correlation.
    #
    # Var[x] / (Var[x] + sigma^2) = 21.5%: balance sheets plus permanent income
    # explain about a fifth of the cross-sectional variance of log(C/Y). The
    # remainder is idiosyncratic. Interpreted here as a FIXED HOUSEHOLD EFFECT
    # (drawn once per household, constant thereafter) rather than i.i.d. noise
    # -- the HFCS cross-section identifies the variance but not its
    # persistence, so this is a modelling decision, recorded as such.
    idiosyncratic_sd: 0.3308
    idiosyncratic_persistence: fixed_effect
    price_floor: 1.0e-12
    income_floor: 1.0e-12
    consumption_floor: 1.0e-12
    house_price_floor: 1.0e-12
    uses_income_belief_learning: true
    income_belief_learning_horizon:
      paper_parameter_file: consumption_paper_parameters.yaml
      paper_parameter_ref: income_belief_learning.permanent_income_log_ratio
    # Ratio denominator. The calibration divides consumption and the three
    # balance-sheet stocks by disp_geom_avg_income -- HFCS's smoothed
    # multi-year disposable income -- NOT by a single year's income. v1
    # divided by current-period annualised spendable income, a materially more
    # volatile denominator, which is the near-zero-denominator mechanism behind
    # issue #90. "geometric_average" restores the calibration's own concept.
    income_denominator: geometric_average
    income_denominator_window: 20          # periods (5 years at quarterly)
    # Warm-up: a household with fewer than `window` observed periods uses the
    # geometric mean of whatever positive history it has, so the denominator
    # converges smoothly rather than jumping at a switchover period.
    continuous_wealth_calibration:
      # ---- PROVISIONAL: two known boundary problems are ported as-is ----
      # 1. c_alpha sits at its UPPER bound (1.000), so alpha_2 spans only
      #    [0.303, 0.475] of its configured [0.25, 0.70] box.
      # 2. k_gamma is at its estimation ceiling (148.4), i.e. gamma_1(B) is
      #    still effectively a step function, with ~0.5% of households
      #    interior.
      # Both are open items in the calibration notebook. These constants are a
      # refresh, not a settled result, and are expected to change when a fit
      # with those bounds freed is available.
      index_construction: raw_ratio
      # The estimated weights multiply the RAW ratios, not per-ratio normalised
      # ones (v1's convention). This matters: the ratios are on very different
      # scales, so on the 2014 wave the mean contribution to B is HA/y +0.289,
      # IFA/y +0.062, NLA/y -0.137 -- housing dominates the index despite
      # carrying the smallest coefficient. Reading these weights as shares of
      # the index is wrong; they are coefficients on unnormalised regressors.
      weight_net_liquid_assets: 0.6719
      weight_illiquid_financial_assets: 0.2486
      weight_housing_assets: 0.0795
      # Two INDEPENDENT logistics. v1 shared one steepness and one midpoint
      # between alpha_2 and gamma_1; the estimator rejects that restriction
      # decisively (k differs by two orders of magnitude).
      alpha_2_steepness: 2.012            # k_alpha = exp(0.69931302)
      alpha_2_midpoint: 1.000             # c_alpha -- AT ITS UPPER BOUND
      gamma_1_steepness: 148.413          # k_gamma = exp(5.0) -- AT ITS CEILING
      gamma_1_midpoint: 0.0532            # c_gamma
      alpha_2_low: 0.25
      alpha_2_high: 0.70
      gamma_1_low: 0.05
      gamma_1_high: 0.25                  # v1 used 0.1997
      # Survey-weighted [p5, p95] of each ratio on the 2014 training wave.
      # In the calibration these are TRIM thresholds (households outside are
      # dropped); at runtime households cannot be dropped, so the same
      # thresholds become clip bounds. That is the intended translation, but it
      # is a translation, not an identity.
      net_liquid_assets_ratio_bounds: [-3.4132, 1.4576]
      illiquid_financial_assets_ratio_bounds: [0.0, 1.6898]
      housing_assets_ratio_bounds: [0.0, 11.5486]
      # B_raw range over the training wave AFTER clipping to the bounds above,
      # i.e. in the runtime order of operations. Frozen, never recomputed from
      # the live household batch -- a per-batch min/max would make a
      # household's alpha_2/gamma_1 depend on which other households happen to
      # be evaluated in the same call, including the income-perturbed MPC probe.
      b_raw_min: -2.2928
      b_raw_max: 2.3172

  credit_augmented_v3:
    # ------------------------------------------------------------------
    # Continuous calibration v3 -- HFCS France, ten-moment covariance-adjusted
    # minimum distance. v1 and v2 are kept above verbatim so their baselines
    # stay reproducible; nothing here mutates them.
    #
    # Three substantive changes over v2:
    #   1. gamma_4 becomes a THIRD fitted map, gamma_4(B), over a range that
    #      SPANS ZERO. v1/v2 held it homogeneous and strictly positive, so
    #      housing wealth could only ever raise consumption. The eleventh
    #      moment rejects that: empirical corr(log C/Y, HA/Y) = -0.163 against
    #      a model value of +0.035, and a direct weighted regression puts the
    #      HA/Y coefficient at -0.0102 (se 0.0005, t = -20.4, n = 29,795).
    #   2. The accessibility weights are FIXED at (0.70, 0.10, 0.20) rather
    #      than estimated. v2's free weights were not separately identified
    #      from the midpoints.
    #   3. All three logistics share a FIXED 10%-90% transition width of 0.10,
    #      which implies k = 43.9445 for each. This removes v2's two boundary
    #      pathologies: c_alpha no longer pins at its upper bound, and k_gamma
    #      is no longer at an estimation ceiling.
    #
    # Provenance: consumption-notebooks/consumption_parameters_calibration.ipynb
    #   estimation wave  2014 only (n = 9,859); 2017/2021 held out
    #   pooled sample    29,688 households of 35,973 raw (17.5% removed)
    #   optimiser        seeded 50-start L-BFGS-B, seed 20260815
    #   objective        8.832928e+02 (33/50 starts within 1e-4 relative)
    # ------------------------------------------------------------------
    long_run_intercept: -0.3813           # alpha_0, ESTIMATED (v2: -0.4638)
    real_borrowing_rate_propensity: -0.72  # alpha_1, unchanged (paper Table 1)
    # INERT while uses_continuous_wealth_calibration is true: alpha_2, gamma_1
    # and now gamma_4 all come from the fitted maps, household by household.
    # Carried at their v1/v2 values so that turning the flag off degrades to a
    # calibrated fallback rather than to the class defaults.
    permanent_income_propensity: 0.55      # alpha_2 fallback
    liquid_wealth_propensity: 0.14         # gamma_1 fallback
    illiquid_wealth_propensity: 0.02       # gamma_2, STILL FIXED, not estimated
    housing_wealth_propensity: 0.009       # gamma_4 fallback -- INERT under v3
    rent_propensity: 1.0
    mortgage_debt_propensity: 0.03
    mortgage_payment_propensity: 1.0
    house_price_propensity: 0.0
    # gamma_3 stays disabled: the base-1.0-vs-base-100 HPI units problem
    # (issue #90) is unchanged by this recalibration.
    income_growth_propensity: 0.15
    interest_rate_cashflow_propensity: -0.003
    uncertainty_propensity: -0.005
    partial_adjustment_speed: 0.56
    long_run_mpc_lower_bound: 0.0
    long_run_mpc_upper_bound: 2.0
    # Idiosyncratic term, ESTIMATED JOINTLY with the maps. Larger than v2's
    # 0.3308: it now explains 74.6% of Var log(C/Y), leaving 25.4% to balance
    # sheets plus permanent income. Still a FIXED HOUSEHOLD EFFECT -- the
    # cross-section identifies the variance but not its persistence, so this
    # remains a recorded modelling decision, not an estimate.
    idiosyncratic_sd: 0.4256
    idiosyncratic_persistence: fixed_effect
    price_floor: 1.0e-12
    income_floor: 1.0e-12
    consumption_floor: 1.0e-12
    house_price_floor: 1.0e-12
    uses_income_belief_learning: true
    income_belief_learning_horizon:
      paper_parameter_file: consumption_paper_parameters.yaml
      paper_parameter_ref: income_belief_learning.permanent_income_log_ratio
    income_denominator: geometric_average
    income_denominator_window: 20          # periods (5 years at quarterly)
    continuous_wealth_calibration:
      index_construction: raw_ratio
      # FIXED by specification, not estimated. They multiply the RAW ratios, so
      # they are coefficients on unnormalised regressors, NOT shares of the
      # index: housing still contributes the largest average share of B despite
      # carrying a smaller coefficient than NLA.
      weight_net_liquid_assets: 0.70
      weight_illiquid_financial_assets: 0.10
      weight_housing_assets: 0.20
      # One shared slope, three separately estimated midpoints. k = 43.9445 is
      # implied by the fixed 10%-90% transition width of 0.10, not fitted.
      alpha_2_steepness: 43.9445
      alpha_2_midpoint: 0.3951            # c_alpha, interior (v2 pinned at 1.000)
      gamma_1_steepness: 43.9445
      gamma_1_midpoint: 0.1466            # c_gamma1
      gamma_4_steepness: 43.9445
      gamma_4_midpoint: 0.2771            # c_gamma4
      alpha_2_low: 0.25
      alpha_2_high: 0.70
      gamma_1_low: 0.007                  # v2 used 0.05
      gamma_1_high: 0.25
      # NEW in v3, and the range SPANS ZERO. Like gamma_1 the map DECREASES in
      # B, so the endpoints read high-B -> min, low-B -> max: the least
      # accessible households carry the largest positive housing response, the
      # most accessible a negative one. Weighted mean on the training wave is
      # -0.0168.
      gamma_4_low: -0.021
      gamma_4_high: 0.021
      # Realised support of each ratio on the retained calibration sample
      # (n = 29,688) after the flag1 hard bounds and the flag2 [p1, p99] trim.
      # In the calibration these are TRIM outcomes (households outside are
      # dropped); at runtime households cannot be dropped, so they become clip
      # bounds. That is the intended translation, but it is a translation, not
      # an identity. NOTE these are pooled across waves and so are marginally
      # wider than the 2014 estimation wave alone; the binding guard on the
      # mapping domain is the b_tilde clip to [0,1] against the 2014-fitted
      # b_raw reference below, not these per-ratio bounds.
      net_liquid_assets_ratio_bounds: [-6.7320, 4.1814]
      illiquid_financial_assets_ratio_bounds: [0.0, 8.5902]
      housing_assets_ratio_bounds: [0.0, 23.5236]
      # Fitted raw-score reference on the 2014 calibration sample
      # (accessibility_normalization: calibration_sample). Frozen, never
      # recomputed from the live household batch -- a per-batch min/max would
      # make a household's coefficients depend on which other households happen
      # to be evaluated in the same call, including the income-perturbed MPC
      # probe that compute_target_consumption runs to difference out the MPC.
      b_raw_min: -4.2232
      b_raw_max: 7.6982

income_belief_learning:
  observed_income_growth_lag_quarters: 4  # hardcoded as index [-5] in country.py
  common_growth_component: cross_sectional_mean_log_real_income_growth  # hardcoded in income_belief_learning.py
  priors:
    data_path: CES/FR_priors_table5.csv
  income_signal:
    # Deflator follows consumer_price_level_series_name() in country.py (defaults to cpi_fixed_basket).
    # If the default deflator is changed, the income belief signal deflator changes with it.
    deflator: cpi_fixed_basket
    lag_quarters: 4  # hardcoded as index [-5] in country.py
    floor: 1.0e-12  # hardcoded default in compute_income_belief_learning_outputs
    skip_update_until_lag_available: true  # hardcoded in country.py
    common_growth_weighting: unweighted_household_mean  # hardcoded in income_belief_learning.py
  kalman_update:  # hardcoded — all policies enforced in income_belief_learning.py
    invalid_innovation_variance_policy: zero_kalman_gain
    non_finite_posterior_mean_fallback: previous_finite_prior_or_zero
    non_finite_posterior_variance_fallback: previous_finite_prior_variance_or_zero
    kalman_gain_bounds: [0.0, 1.0]
    require_posterior_variance_lte_predicted_variance: true
  permanent_income_log_ratio:
    # Parameters that control the zeta weight applied to individual income beliefs
    # in the permanent-income log ratio: zeta = delta^k for k in 0..S-1, then renormalised.
    # delta (discount rate): higher values give more weight to beliefs from earlier periods.
    # S (horizon quarters): number of lagged Kalman-posterior means included in the weighted sum.
    # Consumed via paper_parameter_ref from desired_consumption.credit_augmented_v1.income_belief_learning_horizon.
    delta: 0.95
    S: 40
  common_forecast:
    fallback_when_unavailable:  # hardcoded: _common_permanent_income_terms returns (0.0, 0.0)
      common_permanent_income_log_ratio: 0.0
      common_forecast_variance: 0.0
    data_paths:
      coefficient_table: permanent_income/FR_table.json
      hac_covariance: permanent_income/FR_cov_hac.json
      residual_variance: permanent_income/FR_sigma2_u.json
      design_matrix: permanent_income/FR_design_matrix.csv
    estimation_epoch_source: design_matrix_index_min  # hardcoded in country.py
    base_period_source: coefficient_table_metadata_or_start_period  # hardcoded in country.py
    index_base_value: 100.0  # hardcoded default in rebase_real_pc_income_index
    unemployment_rate_units: share  # hardcoded in permanent_income_mapping.py
    design_matrix_out_of_range_policy: nearest_boundary_row  # hardcoded in permanent_income_mapping.py
    data_dependent_failure_policy: return_none  # hardcoded in country.py
    covid19: 0.0  # hardcoded in build_permanent_income_forecast_regressors
    frozen_exogenous_regressors_source: initial_design  # hardcoded in build_permanent_income_forecast_regressors

consumer_credit:
  # Section 3.3, Table 16 — Chauvin & Muellbauer (2018)
  maturity_quarters: 12
  spread_annual: 0.035  # over 10-yr French government bond yield
  dsti_limit: 0.35      # debt-service-to-income limit
  maximum_borrowing_age: 75

mortgage:
  # Section 3.6, Table 16 — Chauvin & Muellbauer (2018)
  maturity_quarters: 80  # 20 years
  ltv_limit: null        # loan-to-value — not yet calibrated in paper
  lti_limit: null        # loan-to-income — not yet calibrated in paper
  dsti_limit: null       # debt-service-to-income — not yet calibrated in paper

portfolio_composition:
  # Section 3.5, Table 4 — GTP-FRM (Generalised Two-Part Fractional Response Model)
  # Participation and magnitude coefficient vectors are stored in the JSON file below.
  # FRM estimated on pooled HFCS waves 2014/2017/2021 (N=16,869); see data_paths.frm_coefficients
  # for the full coefficient table, including investment_attitudes and windfall_income.
  # NOTE: country_config_FRA.yaml composes this section with asset_returns.paper_stochastic_v1
  # via paper_parameter_refs because PaperAssetReturnWealthSetter hosts both
  # asset-return and Stage 4 diagnostics.
  uses_portfolio_choice: true      # gates Stage 4 diagnostics and optional settlement; false keeps the portfolio block inactive
  settles_portfolio_choice: true   # requires uses_portfolio_choice and an active Stage 5 post-grant feasibility carrier
  target_share_source: scalar       # scalar (default, fixed share below) | frm_magnitude (opt-in, Increment 5: household-covariate FRM target share). Switching to frm_magnitude does not change this default for countries that leave it unset.
  participation_source: initial_ifa_positive   # extensive margin fixed at init from initial_IFA > 0; nonparticipants never buy IFA
  default_target_illiquid_share: 0.65   # first-pass intensive-margin target for all participating households
  liquid_return_source: policy_rate_markup   # r_ell = liquid_asset_policy_rate_markup * policy_rate
  liquid_asset_policy_rate_markup: null   # remains uncalibrated; settled mode uses the existing post-surplus LFA base
  phi_1: 5.0          # from frm_coefficients.adjustment_parameters (frm_estimation.ipynb), not re-derived here
  lambda_kappa: 0.1   # from frm_coefficients.adjustment_parameters; phi_2 = phi_1*(1-lambda_kappa)/lambda_kappa = 45.0 (derived, not configured)
  fixed_cost_share: 0.001   # paper example: Upsilon = 0.001 * total financial assets
  frm_coefficients_path: data/raw_data/portfolio/FR_portfolio_frm_coefficients.json
  dynamic_shifters_enabled: false   # gates whether dynamic_shifters below move target shares; false until Stage 3 validation lands
  dynamic_shifters:
    income_expectations: 0.0   # ϑ_μ
    uncertainty: 0.0           # ϑ_θ
    return_differential: 0.0   # ϑ_r
  data_paths:
    frm_coefficients: data/raw_data/portfolio/FR_portfolio_frm_coefficients.json
  # Open HFCS-sourcing decisions (Increment 1, not yet resolved):
  #   investment_attitudes (HD1800): requires the HFCS reader to thread HD1800 into household init
  #     state for the designated household head, frozen thereafter (no dynamic recompute).
  #   windfall_income: Option A (fix at 0 for all households) biases the participation index
  #     downward by coefficient * P(windfall) and would need an explicit constant recalibration;
  #     Option B (freeze each household's own HFCS initial value at init) preserves the
  #     exclusion-restriction identification and is the preferred option.
  #   See knowledge-vault/wiki/architecture/consumption-stage-4-portfolio-choice.md for full discussion.

housing_market:
  # Section 3.6, A.7.1 — placeholder; not yet implemented
  placeholder: true

financial_distress:
  # Section 3.3.2 — French FICP / délai de grâce rules
  ficp_exclusion_years: 5
  grace_period_years: 2
  missed_payments_to_delinquency: 1
  missed_payments_to_ficp: 2

subsistence_consumption:
  # Section 3.1.1 — SMIC-based subsistence floor, with consumer-unit (CU) weights
  # smic_monthly_override: if set (non-null), use this fixed monthly SMIC value (€, nominal);
  #   if null, load from the CSV data path below and select the appropriate year.
  smic_monthly_override: null  # e.g. 1128.70 for the 2014 paper calibration
  data_paths:
    smic_monthly_values: INSEE/SMIC_monthly_values.csv
  cu_weights:
    first_adult: 1.0
    additional_adult: 0.5  # age >= 14
    child: 0.3             # age < 14
