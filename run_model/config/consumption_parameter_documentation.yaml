# Documentation-only companion to consumption_paper_parameters.yaml.
# Not consumed at runtime. Contains:
#   stage_0  — source-audit annotations, account-mapping notes, and architectural decisions
#   stage_2  — paper-symbol cross-reference and input wiring notes
#   stage_3  — architectural records: classification schemas, signal choices, validation flags
#   stage_4  — portfolio-choice settings, shadow diagnostics, and settlement gates
#
# Rule: update consumption_paper_parameters.yaml first when recalibrating.
# Numeric values repeated here are copies for human reference; this file is not authoritative.

stage_0:
  source_audit:
    behaviour_preserving: true
    registry_role: single_consumption_implementation_registry
  account_mapping:
    lfa:
      paper_concept: liquid_financial_assets
      notebook_source: DA2101
      macro_reader_source: Wealth in Deposits
      runtime_source: liquid_financial_assets
      note: Do not use notebook nla as LFA.
    ifa:
      paper_concept: illiquid_financial_assets
      notebook_source: DA2102 + DA2103 + DA2105 + DA2106 + DA2107 + DA2108 + DA2109
      macro_reader_source: "Mutual funds, bonds, shares, managed accounts, receivables, other assets, voluntary pension"
      runtime_source: illiquid_financial_assets
      note: Excludes DA2104 private business wealth.
    ha:
      paper_concept: housing_wealth
      notebook_source: DA1110 + DA1122
      macro_reader_source: "Main residence + other non-business real estate"
      runtime_source: "wealth_main_residence + wealth_other_properties + wealth_other_real_assets"
      note: Uses main residence plus non-business other real estate, not all real assets.
    mr:
      paper_concept: mortgage_debt
      notebook_source: DL1100
      macro_reader_source: "Outstanding Balance of Mortgage Debt"
      runtime_source: mortgage_debt
      note: Richer splits include HMR mortgage DL1110 and other-property mortgage DL1120.
    db:
      paper_concept: consumer_debt
      notebook_source: DL1200
      macro_reader_source: "Outstanding Balance of Non-Mortgage Debt"
      runtime_source: consumption_loan_debt
      note: Total non-mortgage debt, including credit line/card components where present.
    nw:
      paper_concept: net_worth
      formula: LFA + IFA + HA - MR - DB
      note: Compute explicitly in diagnostics.
  source_compatibility:
    ifa_excludes_private_business_wealth: true
    ha_definition: main_residence_plus_non_business_other_real_estate
    db_definition: total_non_mortgage_debt
  runtime_income:
    model_field: households.ts["income"]
    label: model_spendable_income
    note: Use the model's spendable-income proxy, not the notebook/HFCS disposable-income construction.
  real_value_deflators:
    default: cpi_fixed_basket
    sensitivity: cpi_transaction
    note: Use fixed-basket CPI for default real ratios; report transaction-CPI sensitivity where useful.
  behaviour:
    read_only: true  # stage_0 is behaviour-preserving; no model behaviour changes

stage_2:
  implementation_contract:
    paper_symbol_map:  # paper symbol → current calibrated value; source: Chauvin & Muellbauer (2018) Table 1
      alpha_0: 0.08    # long_run_intercept
      alpha_1: -0.72   # real_borrowing_rate_propensity
      alpha_2: 0.55    # permanent_income_propensity
      gamma_1: 0.14    # liquid_wealth_propensity (NLA/income)
      gamma_2: 0.022   # illiquid_wealth_propensity (IFA/income)
      gamma_3: 0.013   # housing_wealth_propensity (HA/income)
      gamma_4: -0.062  # house_price_propensity (log house prices/income)
      beta_1: 0.15     # income_growth_propensity
      beta_2: -0.003   # interest_rate_cashflow_propensity (to be calibrated)
      beta_3: -0.005   # uncertainty_propensity (to be calibrated)
      lambda: 0.56     # partial_adjustment_speed
    input_mapping:
      current_income:
        source: households.ts.current.expected_income
        label: model_spendable_income_planning_base
        deflator: current_consumer_price_level
      lagged_income:
        source: households.ts.prev.expected_income
        fallback: current_income
        deflator: lagged_consumer_price_level
      lagged_consumption:
        source: households.ts.prev.consumption
        fallback: historic_consumption_sum_last
        deflator: lagged_consumer_price_level
      real_net_liquid_assets:
        formula: lagged_liquid_financial_assets - lagged_mortgage_debt - lagged_consumption_loan_debt
        deflator: lagged_consumer_price_level
      illiquid_financial_assets:
        source: households.ts.prev.illiquid_financial_assets
        deflator: lagged_consumer_price_level
      housing_wealth:
        formula: households.ts.current.wealth_main_residence + households.ts.current.wealth_other_properties
        deflator: current_consumer_price_level
      house_price:
        source: economy.ts.prev.hpi
        fallback: economy.ts.current.hpi
        interpretation: index_proxy_not_currency_price_level
      consumer_debt:
        source: households.ts.prev.consumption_loan_debt
        excludes_mortgage_debt: true
      real_borrowing_rate:
        source: placeholder
        default: 0.0
      permanent_income_log_ratio:
        source: stage_3.income_belief_learning
        default_when_unavailable: 0.0
      consumer_debt_rate_delta:
        source: placeholder
        default: 0.0
      uncertainty_delta:
        source: stage_3.income_belief_learning
        default_when_unavailable: 0.0
      current_cpi:
        source: economy.current_consumer_price_level
      initial_cpi:
        source: economy.initial_consumer_price_level
      lagged_cpi:
        source: economy.ts.prev.consumer_price_level_series_name
      expected_inflation:
        source: economy.current_expected_consumer_period_inflation
    target_rule_switches:
      rent_enters_behavioural_target: false
      mortgage_debt_enters_behavioural_target: false
      mortgage_service_enters_behavioural_target: false
      rent_kept_as_feasibility_diagnostic: true
      mortgage_service_kept_as_feasibility_diagnostic: true
      formula_implied_mpc_method: perturb_real_spendable_income
      nominalization: current_deflator_times_expected_inflation

stage_3:
  income_belief_learning:
    enabled: true  # controlled by uses_income_belief_learning in stage_2 config
    priors:
      required_fields:
        - rho_q
        - mu_1_0
        - P_1_0
        - sigma2_xi
        - sigma2_v
      classification:
        employment_statuses:
          - employed
          - unemployed
          - retired
        age_groups:
          - 18-34
          - 35-49
          - 50-70
          - 71-85
      fallback_missing_cell:
        from: unemployed_50_70
        to: unemployed_71_85
      household_aggregation: income_weighted_adult_members
      zero_income_weight_fallback: equal_adult_member_weights
      rho_scope: scalar
      runtime_posterior_state_only: true
    income_signal:
      source: households.ts.income_employee + income_social_transfers + income_rental
      label: non_financial_household_income
      excludes: income_financial_assets
      rationale: >
        CES respondents reporting expected income growth had employment/transfer income
        in mind, not volatile stochastic asset returns. Financial returns enter the model
        separately via Stage 1 (balance sheet) and the IFA wealth term gamma_2 in Stage 2.
        Using total income (including r_kappa * IFA) produces pathological log-signals
        after bad market draws for high-IFA households; non-financial income is strictly
        positive and well-behaved.
    common_forecast:
      enabled: true  # forecast runs whenever uses_income_belief_learning is true and data paths are available
      real_pc_income:
        source: households.ts.income
        label: model_spendable_income
        deflator: cpi_fixed_basket
        population_denominator: individuals.ts.n_individuals
      policy_rate_source: central_bank.ts.policy_rate
    validation:
      validate_mu_hat_p_against_ces_moments: false
      validate_kalman_gain_bounds: true
      validate_posterior_variance_lte_predicted_variance: true

# Portfolio-choice interface. Stage 4 diagnostics are available when
# uses_portfolio_choice is true; settled reallocation additionally requires the
# Stage 5 feasibility resolver and its post-liquidation carrier.
stage_4:
  portfolio_choice:
    uses_portfolio_choice: false
    settles_portfolio_choice: false
    target_share_source: precomputed
    participation_source: initial_ifa_positive
    default_target_illiquid_share: 0.0
    liquid_return_source: policy_rate_markup
    liquid_asset_policy_rate_markup: 1.0
    phi_1: 5.0
    phi_2: 45.0
    phi_2_derivation:
      derived_from: [phi_1, adjustment_speed]
      formula: phi_1 * (1 / adjustment_speed - 1)
      independent_calibration: false
    fixed_cost_share: 0.001
    adjustment_speed: 0.1
    dynamic_shifters_enabled: false
    dynamic_adjustment_speed_enabled: false
    no_borrowing_for_financial_asset_acquisition: true
    shadow_mode_preserves_balance_sheet: true
    settled_mode_requires_feasibility_resolver: true
    target_share_bounds:
      min: 0.0
      max: 1.0
      clipping_diagnostic: true
    participation_rule:
      initial_ifa_positive_threshold: 0.0
      nonparticipants_can_buy_ifa: false
    portfolio_base:
      lfa_source: stage_0.account_rules.lfa
      ifa_source: stage_0.account_rules.ifa
      opening_tfa_formula: LFA + IFA
      post_return_ifa_formula: (1 + r_kappa) * IFA_lagged
      post_return_lfa_formula: (1 + r_ell) * LFA_lagged
      target_tfa_base_formula: post_return_lfa + post_return_ifa + max(investable_surplus, 0)
      positive_surplus_only: true
    adjustment_rule:
      lambda_formula: phi_1 / (phi_1 + phi_2)
      fixed_cost_base: total_financial_assets
      adjustment_cost_paid_from: liquid_assets
      constrained_projection_rule: true
      no_financial_assets_policy: no_positive_illiquid_acquisition
    return_sources:
      illiquid_return_source: stage_1.asset_returns.paper_stochastic_v1
      liquid_return_source: policy_rate_markup
      do_not_redraw_stage_1_return: true
    shadow_mode_invariants:
      does_not_change_consumption: true
      does_not_change_lfa: true
      does_not_change_ifa: true
      does_not_change_debt: true
      does_not_change_net_worth: true
    diagnostics:
      - portfolio_actual_illiquid_share
      - portfolio_opening_tfa_scale
      - portfolio_target_tfa_base
      - portfolio_post_return_lfa
      - portfolio_post_return_ifa
      - portfolio_liquid_return_rate
      - portfolio_illiquid_return_rate
      - portfolio_investable_surplus_proxy
      - portfolio_participation_probability
      - portfolio_participates
      - portfolio_target_illiquid_share
      - portfolio_target_illiquid_assets
      - portfolio_delta_tilde
      - portfolio_kappa_star_tilde
      - portfolio_kappa_tilde
      - portfolio_desired_illiquid_adjustment
      - portfolio_adjustment_cost
      - portfolio_counterfactual_lfa_flow
      - portfolio_counterfactual_ifa_flow
      - portfolio_inaction_flag
      - portfolio_upper_bound_flag
      - portfolio_lower_bound_flag
      - portfolio_no_financial_assets_flag
      - portfolio_target_share_clipped_flag
      - portfolio_settlement_enabled
