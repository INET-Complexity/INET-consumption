  #   functions:
  #     clearing:
  #       name: WaterBucketGoodsMarketClearer
  #       path_name: clearing
  #       parameters:
  #         consider_trade_proportions: true
  #         consider_buyer_priorities: true
  #         additionally_available_factor: 0.2
  #         price_markup: 0.2
  #         price_temperature: 2.0
  #         prio_domestic_sellers: false
  #         prio_high_prio_buyers: false
  #         prio_high_prio_sellers: false
  #         real_country_prioritisation: 10.0
  #         probability_keeping_previous_seller: 0.0
  #         trade_temperature: 0.0
  #         seller_selection_distribution_type: additive
  #         seller_minimum_fill: 0.9
  #         buyer_minimum_fill_macro: 0.0
  #         buyer_minimum_fill_micro: 0.95
  #         deterministic: true

  labour_market:
    functions:
      clearing:
        name: DefaultLabourMarketClearer
        path_name: clearing
        parameters:
          allow_switching_industries: true
          compare_with_normalised_inputs: true
          consider_reservation_wages: true
          firing_cost_fraction: 0.0
          firing_speed: 1.0
          hiring_cost_fraction: 0.0
          hiring_speed: 0.75
          individuals_quitting: false
          individuals_quitting_temperature: 1.0
          optimised_hiring: true
          random_firing_probability: 0.0
          round_target_employment: true
          sorted_firing: true

  housing_market:
    functions:
      clearing:
        name: AutomaticHousingMarketClearer
        path_name: clearing
        parameters:
          random_assignment_shock_variance: 0.0
      value:
        name: DefaultPropertyValueSetter
        path_name: value
        parameters:
          random_fluctuation_std: 0.0

  credit_market:
    functions:
      clearing:
        name: WaterBucketCreditMarketClearer
        path_name: clearing
        parameters:
          allow_household_loans: true
          allow_short_term_firm_loans: true
          consider_loan_type_fractions: true
          credit_supply_temperature: 2  # 0.0
          creditor_minimum_fill: 0.0
          creditor_selection_is_deterministic: true
          debtor_minimum_fill: 0.0
          firms_max_number_of_banks_visiting: 5
          households_max_number_of_banks_visiting: 5
          interest_rates_selection_temperature: 0.0



  forecasting_window: 60
  assume_zero_growth: false
  assume_zero_noise: false
