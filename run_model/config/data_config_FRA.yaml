# Data configuration (FRA)
countries: ['FRA']
year: 2014
quarter: 1
time_unit: 3
prune_date: null
purpose: "Consumption module"
author: INET - Andrea Gurgone
aggregate_industries: true
can_disaggregation: false
seed: 38
aggregation_structure: null


country_configs:
  FRA:
    firms_configuration:
      constructor: Default
      zero_initial_deposits: false
      zero_initial_debt: true
      initial_inventory_to_input_fraction: 0
      intermediate_inputs_utilisation_rate: 0.85  # 1.0
      capital_inputs_utilisation_rate: 0.85  # 1.0
      capital_compensation_accounting_mode: surplus_pool
      capital_depreciation_accounting_mode: eurostat_cfc
      capital_replacement_matrix_source: eurostat_cfc_output

    banks_configuration:
      constructor: Default
      long_term_firm_loan_maturity: 60  # 60
      consumption_exp_loan_maturity: 2  # 12
      mortgage_maturity: 100 # 120
      interest_rates:
        consumption_loans_markup: 0.01
        mortgage_markup: 0.1
        household_overdraft_markup: 0.01

    central_bank_configuration:
      inflation_target: 0.02

    single_bank: false
    single_firm_per_industry: false
    single_government_entity: false
    scale: 5000
    # France 2014 general-government cash social benefits (Eurostat/INSEE):
    # 20.0% of annual GDP. The reader converts this envelope to model-quarter units.
    cash_social_benefits_gdp_ratio: 0.20
    eu_proxy_country: null
    carbon_price: 0.0

row_data_config:
  fit_imports: false
  fit_exports: false
  assume_one_exporter_by_industry: true
