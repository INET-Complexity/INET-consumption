# Data configuration (FRA)
countries: ['FRA']
year: 2014
quarter: 1
time_unit: 3
prune_date: null
purpose: "Consumption module"
author: INET - Andrea Gurgone
aggregate_industries: true
can_disaggregation: false
seed: 38
aggregation_structure: null


country_configs:
  FRA:
    hfcs_implicate: 1  # Same first-implicate extraction in both methods.
    # First implicate, registered source. Set method: legacy for comparison.
    # Source paths are relative to RAW_DATA_PATH. Opening allocation is pending.
    household_consumption_initialisation:
      method: hfcs_cy
      implicate: 1
      source_file: hfcs/consumption_initialisation/FRA_2014.parquet
      source_sha256: edf089b68d517f4a303127b458bb91c2ab167c3894036b6343af51b19339bc45
      registration_file: hfcs/consumption_initialisation/FRA_2014.registration.json
      registration_sha256: 4cc18938b7076f9a00276d3a51712a0967cb6fc9283a10d54c02186331a84053
      # Scale stocks by k_i = model / HFCS net income (vault spec 2026-11-24-balance-sheet-scaling).
      balance_sheet_scaling: true
    firms_configuration:
      constructor: Default
      zero_initial_deposits: false
      zero_initial_debt: true
      initial_inventory_to_input_fraction: 0
      intermediate_inputs_utilisation_rate: 0.85  # 1.0
      capital_inputs_utilisation_rate: 0.85  # 1.0
      # Aligned with macro-main (2026-11-12): capital charged as a*y wear. Must match country_config_FRA.yaml.
      capital_compensation_accounting_mode: production_cost  # was surplus_pool
      capital_depreciation_accounting_mode: none  # was eurostat_cfc
      capital_replacement_matrix_source: eurostat_cfc_output

    banks_configuration:
      constructor: Default
      long_term_firm_loan_maturity: 60  # 60
      consumption_exp_loan_maturity: 2  # 12
      mortgage_maturity: 100 # 120
      interest_rates:
        consumption_loans_markup: 0.01
        mortgage_markup: 0.1
        household_overdraft_markup: 0.01

    central_bank_configuration:
      inflation_target: 0.02

    single_bank: false
    single_firm_per_industry: false
    single_government_entity: false
    scale: 5000
    # Same value as central_government.tax_overrides in country_config_FRA.yaml: D611 / D11, 2014.
    employer_social_insurance_rate: 0.30552085148943465
    # Annual rent/value floor applied to the initial dwelling rents (issue #197). The runtime
    # rent rule uses it too unless country_config_FRA.yaml sets its own value for a scenario.
    minimum_annual_rental_yield: 0.02
    eu_proxy_country: null
    carbon_price: 0.0
    # Worker productivity rho (wage-competition specification, Step 0): fixed worker labour
    # inputs from survey income. 13544 = net annual SMIC 2014 (1128.70 EUR/month x 12).
    # On in the base config since 2026-11-19 (user). Preset `wage_competition_off` (config.py) removes it.
    worker_productivity:
      annual_wage_floor: 13544.0

row_data_config:
  fit_imports: false
  fit_exports: false
  assume_one_exporter_by_industry: true
